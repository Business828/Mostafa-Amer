<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostafa | Media Buyer</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
}

section { margin-top: 20px; }

/* HERO */
.hero {
    height: 380px;
    position: relative;
    overflow: hidden;
}
.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('cover.webp') center/cover;
    filter: blur(20px);
    transform: scale(1.2);
}
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url('cover.webp') center/contain no-repeat;
}
.overlay {
    position: relative;
    height: 100%;
    display: flex;
    align-items: flex-end;
    padding: 40px;
}
.hero h1 {
    font-size: 42px;
    background: linear-gradient(45deg,#d4af37,#f7e7a1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.hero p {
    color: #ddd;
}
.btn {
    background: linear-gradient(45deg,#d4af37,#f7e7a1);
    color: black;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 4px;
}

/* STATS */
.stats {
    display: flex;
    justify-content: space-around;
    background: #111;
    padding: 30px;
}
.stat-box h3 { color:#d4af37; }

/* ABOUT + SKILLS */
.about-skills {
    padding:80px 20px;
}
.two-columns {
    display:flex;
    gap:50px;
    flex-wrap:wrap;
}
.about-box, .skills-box {
    flex:1;
    min-width:300px;
}
h2 {
    color:#d4af37;
}
.skill-group { margin-bottom:20px; }
.bar {
    height:6px;
    background:#222;
}
.bar div {
    height:100%;
    background:linear-gradient(45deg,#d4af37,#f7e7a1);
}

/* RESULTS */
.results { padding:80px 20px; }
.gallery {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}
.gallery img {
    width:100%;
    height:200px;
    object-fit:cover;
}

/* CONTACT */
.contact {
    background:#111;
    padding:60px;
    text-align:center;
}
</style>
</head>

<body>

<!-- HERO -->
<header class="hero">
<div class="overlay">
<div>
<h1>Mostafa</h1>
<p>Media Buyer | I Help Brands Scale</p>
<a href="#contact" class="btn">Work With Me</a>
</div>
</div>
</header>

<!-- STATS -->
<section class="stats">
<div class="stat-box"><h3>3+</h3><p>Years</p></div>
<div class="stat-box"><h3>50+</h3><p>Clients</p></div>
<div class="stat-box"><h3>$1M+</h3><p>Ad Spend</p></div>
</section>

<!-- ABOUT + SKILLS -->
<section class="about-skills">
<div class="two-columns">

<div class="about-box">
<h2>About Me</h2>
<p>Media Buyer with 3+ years experience helping businesses grow.</p>
</div>

<div class="skills-box">
<h2>Skills</h2>

<div class="skill-group">
<p>Meta Ads</p>
<div class="bar"><div style="width:90%"></div></div>
</div>

<div class="skill-group">
<p>Retargeting</p>
<div class="bar"><div style="width:88%"></div></div>
</div>

</div>

</div>
</section>

<!-- RESULTS -->
<section class="results">
<h2>Results</h2>

<h3>Sales in 30 Days</h3>
<div class="gallery">
<img src="1.jpg">
<img src="2.jpg">
</div>

<h3>Sales in 1 Day</h3>
<div class="gallery">
<img src="3.jpg">
</div>

<h3>Various Results</h3>
<div class="gallery">
<img src="4.jpg">
<img src="5.jpg">
<img src="6.jpg">
<img src="7.jpg">
<img src="8.jpg">
<img src="9.jpg">
<img src="10.jpg">
<img src="11.jpg">
<img src="12.jpg">
<img src="13.jpg">
<img src="14.jpg">
<img src="15.jpg">
<img src="16.jpg">
</div>

</section>

<!-- CONTACT -->
<section class="contact" id="contact">
<h2>Contact</h2>
<p>Email: your@email.com</p>
</section>

</body>
</html>
